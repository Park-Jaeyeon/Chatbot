services:
  ollama:
    image: ollama/ollama:latest
    container_name: gg-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  bot:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    env_file:
      - ../.env
    environment:
      GEMMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

volumes:
  ollama-data:
